name: AquaChat
version: '1.0.0'
main: com.aquaforge.chat.AquaChat
api-version: '1.21'
author: Turgut Efekan Koç (efekkoc)
website: https://github.com/efekkoc/AquaChat
description: RGB Gradient Chat, Prefix & Hoverable Item Engine for Paper 1.20.x – 1.21.11

commands:
  channel:
    description: Switch between chat channels
    permission: aquachat.user
    aliases: [ch]
    usage: /<command> [global|local|staff]
  item:
    description: Broadcast your held item in chat
    permission: aquachat.item
    usage: /<command>

permissions:
  aquachat.user:
    description: Standard chat access
    default: true
  aquachat.color:
    description: Permission to use color and hex in chat
    default: op
  aquachat.item:
    description: Permission to showcase items in chat
    default: true
  aquachat.staffchat:
    description: Permission to view and speak in staff chat
    default: op
