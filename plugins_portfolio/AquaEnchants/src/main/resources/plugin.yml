name: AquaEnchants
version: '1.0.0'
main: com.aquaforge.enchants.AquaEnchants
api-version: '1.21'
author: Turgut Efekan Koç (efekkoc)
website: https://github.com/efekkoc/AquaEnchants
description: VeinMiner, Timber, Auto-Smelt and Telepathy Engine for Paper 1.20.x – 1.21.11

commands:
  enchants:
    description: View available custom enchantments and abilities
    permission: aquaenchants.use
    usage: /<command>
  givebook:
    description: Give custom enchantment book to a player
    permission: aquaenchants.admin
    usage: /<command> <enchant> [player]

permissions:
  aquaenchants.use:
    description: Permission to use custom enchantments
    default: true
  aquaenchants.admin:
    description: Admin commands for enchantments
    default: op
