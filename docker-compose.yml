version: '3.8'

services:
  aquaforge:
    build: .
    container_name: aquaforge_server
    ports:
      - "4000:4000"
      - "5173:5173"
      - "25565:25565"
    volumes:
      - ./server/server_data:/app/server/server_data
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
